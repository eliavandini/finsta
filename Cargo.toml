[package]
name = "finsta"
version = "0.1.0"
edition = "2024"
description = "A calm Instagram client for GTK: direct messages and a following-only home feed"

[features]
default = ["webkit"]
# Sign in through an embedded Instagram login page (handles 2FA and checkpoints).
# Without it, sign-in is only possible by pasting a session cookie.
webkit = ["dep:webkit6"]

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_18"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"] }
webkit6 = { version = "0.6", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli", "deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
url = "2"
regex = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
gstreamer = "0.25"

[profile.release]
lto = "thin"

[build-dependencies]
glib-build-tools = "0.22"
